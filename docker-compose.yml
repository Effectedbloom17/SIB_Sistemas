services:
  db:
    image: mariadb:10.6
    container_name: biznaga_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      # Permite root desde otras PCs de la LAN (además de localhost).
      MARIADB_ROOT_HOST: "%"
      TZ: America/Mexico_City
    command:
      - --bind-address=0.0.0.0
      - --skip-name-resolve
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - biznaga_mariadb_data:/var/lib/mysql
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - ./docker/init-lan-grants.sql:/docker-entrypoint-initdb.d/02-init-lan-grants.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: biznaga_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
      UPLOAD_LIMIT: 128M
      TZ: America/Mexico_City

volumes:
  biznaga_mariadb_data:
