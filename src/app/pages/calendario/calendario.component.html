<div class="header header-bg-image pb-6 pt-4 pt-md-6 d-flex align-items-center position-relative overflow-hidden">
  
  <div class="container-fluid d-flex align-items-center justify-content-center position-relative" style="z-index: 2;">
    <div class="row w-100 text-center">
      <div class="col-12">
        <div class="d-flex flex-column align-items-center justify-content-center">
          <div class="icon icon-shape text-white rounded-circle shadow mb-2"
               style="background: rgba(255,255,255,0.15); font-size: 1.8rem;">
            <i class="fas fa-calendar-alt"></i>
          </div>
          <h1 class="text-white mb-0" style="font-weight: 700; font-size: 2.2rem; letter-spacing: -0.5px;">Calendario de Cursos</h1>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid mt--5 calendar-page-wrap" style="position: relative; z-index: 10; margin-bottom: 3rem;">
  <div class="row mx-0">
    <div class="col-12">
      <div class="card shadow-lg border-0" style="border-radius: 15px; overflow: hidden;">
        
        <div class="card-header border-0" style="padding: 1.5rem 2rem;">
          <div class="d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center">
            <div class="mb-3 mb-lg-0">
              <h6 class="text-uppercase text-muted ls-1 mb-1" style="font-size: 0.75rem; font-weight: 600;">Agenda y Programación</h6>
              <h2 class="mb-0" style="color: #38512F; font-weight: 700; font-size: 1.5rem;">
                <i class="fab fa-google mr-2"></i>Vista de Calendario
              </h2>
            </div>

            <div class="calendar-header-calendars mb-0">
              <h6 class="calendar-header-calendars-title mb-2">Mis calendarios</h6>

              <div *ngIf="isLoadingCalendariosSidebar" class="small text-muted">
                <i class="fas fa-spinner fa-spin mr-1"></i>Cargando calendarios...
              </div>

              <div class="calendar-header-calendars-list" *ngIf="!isLoadingCalendariosSidebar">
                <label
                  class="calendar-header-chip"
                  [class.is-active]="calendario.fijo || calendario.seleccionado"
                  [class.is-fixed]="calendario.fijo"
                  *ngFor="let calendario of calendariosSidebar">
                  <input
                    type="checkbox"
                    [checked]="calendario.fijo || calendario.seleccionado"
                    [disabled]="calendario.fijo"
                    (change)="cambiarSeleccionCalendario(calendario, $event)">
                  <span
                    class="calendar-header-chip-dot"
                    [style.border-color]="calendario.color"
                    [style.background-color]="(calendario.fijo || calendario.seleccionado) ? calendario.color : 'transparent'">
                  </span>
                  <span class="calendar-header-chip-name">{{ calendario.nombre }}</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="card-body p-0">
          <div class="calendar-embed-wrap">
            <div class="calendar-frame-holder">
              <iframe [src]="calendarSrc | safe: 'resourceUrl'"
                      style="border: 0; width: 100%; height: 100%;"
                      frameborder="0"
                      scrolling="no"
                      referrerpolicy="strict-origin-when-cross-origin"
                      loading="lazy"
                      title="Google Calendar de cursos">
              </iframe>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
