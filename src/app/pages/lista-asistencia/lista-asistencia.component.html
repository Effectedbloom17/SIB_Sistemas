<!-- Header Estándar -->
<div class="header header-bg-image pb-6 pt-4 pt-md-6 d-flex align-items-center position-relative overflow-hidden">

  <!-- Botón de regreso -->
  <button class="btn btn-outline-light"
          (click)="volverADetalleCurso()"
          style="position: absolute; left: 2rem; top: 2rem; z-index: 3; padding: 0.6rem 1.5rem; border-radius: 8px;">
    <i class="fas fa-arrow-left mr-2"></i>Volver
  </button>

  <div class="container-fluid d-flex align-items-center justify-content-center position-relative" style="z-index: 2;">
    <div class="row w-100 text-center">
      <div class="col-12">
        <div class="d-flex flex-column align-items-center justify-content-center">
          <div class="icon icon-shape text-white rounded-circle shadow mb-2"
               style="background: rgba(255,255,255,0.15); font-size: 1.8rem;">
            <i class="fas fa-users"></i>
          </div>
          <h1 class="text-white mb-0" style="font-weight: 700; font-size: 2.2rem; letter-spacing: -0.5px;">
            Lista de Asistencia
          </h1>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Contenedor Principal -->
<div class="container-fluid mt--5" style="position: relative; z-index: 10; margin-bottom: 3rem;">
  <div class="row justify-content-center">
    <div class="col-xl-11">

      <!-- Card Principal -->
      <div class="card shadow-lg border-0" style="border-radius: 15px; overflow: hidden; background-color: #fff;">

        <!-- Card Header -->
        <div class="card-header border-0" style="padding: 1.5rem 2rem;">
          <div class="row align-items-center">
            <div class="col">
              <h6 class="text-uppercase text-muted ls-1 mb-1" style="font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;">
                Gestión de Participantes
              </h6>
              <h2 class="mb-0" style="color: #38512F; font-weight: 700; font-size: 1.5rem;">
                Participantes del Curso
                <span class="badge badge-pill ml-2"
                      style="background: linear-gradient(135deg, #38512F 0%, #768D6B 100%);
                             color: white; font-size: 0.75rem; vertical-align: middle;">
                  {{ participantes.length }}
                </span>
              </h2>
            </div>
            <div class="col-auto d-flex" style="gap: 0.5rem;">
              <button class="btn btn-success shadow"
                      (click)="descargarConstancias()"
                      title="Descargar constancias"
                      style="background: linear-gradient(135deg, #38512F 0%, #5a7456 100%);
                             border: none; padding: 0.6rem 1.5rem; font-weight: 600;">
                <i class="fas fa-file-download mr-2"></i>Constancias
              </button>
              <button class="btn btn-success shadow"
                      (click)="descargarDC3()"
                      title="Descargar DC-3"
                      style="background: linear-gradient(135deg, #768D6B 0%, #8fa382 100%);
                             border: none; padding: 0.6rem 1.5rem; font-weight: 600;">
                <i class="fas fa-certificate mr-2"></i>DC-3
              </button>
            </div>
          </div>
        </div>

        <!-- Card Body -->
        <div class="card-body" style="padding: 2rem;">
          <!-- Filtro por nombre -->
          <div class="row mb-4">
            <div class="col-12">
              <label class="form-control-label">
                <i class="fas fa-search mr-2" style="color: #38512F;"></i>Buscar Participante
              </label>
              <input type="text"
                     class="form-control"
                     placeholder="Buscar por nombre, CURP o puesto..."
                     [(ngModel)]="filtroNombre"
                     (input)="filtrarParticipantes()">
            </div>
          </div>

          <div class="table-responsive">
            <table class="table align-items-center table-flush table-hover">
              <thead class="thead-light">
                <tr>
                  <th>Nombre</th>
                  <th>CURP</th>
                  <th>Puesto</th>
                  <th class="text-center">Documentos</th>
                </tr>
              </thead>
              <tbody class="list">
                <tr *ngFor="let participante of participantesFiltrados">
                  <td>
                    <div class="d-flex align-items-center">
                      <span class="avatar rounded-circle mr-3 shadow-sm d-flex align-items-center justify-content-center"
                            style="width: 45px; height: 45px; background: linear-gradient(135deg, #38512F 0%, #5a7456 100%);">
                        <i class="fas fa-user-circle text-white" style="font-size: 1.5rem;"></i>
                      </span>
                      <span class="font-weight-bold">{{ participante.nombre }}</span>
                    </div>
                  </td>
                  <td class="text-muted">{{ participante.curp }}</td>
                  <td class="text-muted">{{ participante.puesto }}</td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-info"
                            (click)="verDetallesDocumentos(participante)"
                            title="Ver Documentos"
                            style="padding: 0.25rem 0.75rem;">
                      <i class="fas fa-file-alt mr-1" style="font-size: 0.75rem;"></i>
                      Detalles
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
