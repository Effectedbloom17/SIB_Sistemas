<!-- Header Estándar -->
<div class="header header-bg-image pb-6 pt-4 pt-md-6 d-flex align-items-center position-relative overflow-hidden">

  <div class="container-fluid d-flex align-items-center justify-content-center position-relative" style="z-index: 2;">
    <div class="row w-100 text-center">
      <div class="col-12">
        <div class="d-flex flex-column align-items-center justify-content-center">
          <div class="icon icon-shape text-white rounded-circle shadow mb-2"
            style="background: rgba(255,255,255,0.15); font-size: 1.8rem;">
            <i class="fas fa-graduation-cap"></i>
          </div>
          <h1 class="text-white mb-0" style="font-weight: 700; font-size: 2.2rem; letter-spacing: -0.5px;">
            {{ getNombreCategoria(categoria) }}
          </h1>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Contenedor Principal -->
<div class="container-fluid mt--5" style="position: relative; z-index: 10; margin-bottom: 3rem;">
  <div class="row justify-content-center">
    <div class="col-xl-11">

      <!-- Card Principal -->
      <div class="card shadow-lg border-0" style="border-radius: 15px; overflow: hidden; background-color: #fff;">
        <div class="card-header border-0" style="padding: 1.5rem 2rem;">
          <div class="row align-items-center">
            <div class="col">
              <h6 class="text-uppercase text-muted ls-1 mb-1" style="font-size: 0.85rem; font-weight: 600;">Categoría
              </h6>
              <h2 class="mb-0" style="color: #38512F; font-weight: 700; font-size: 1.5rem;">{{
                getNombreCategoria(categoria) }}</h2>
            </div>
            <div class="col-auto">
              <button class="btn btn-outline-secondary" (click)="volverACategorias()"
                style="padding: 0.6rem 1.5rem; border-radius: 8px;">
                <i class="fas fa-arrow-left mr-2"></i>Volver
              </button>
            </div>
          </div>
        </div>
        <div class="card-body" style="padding: 2rem;">

          <!-- Filtro de búsqueda -->
          <div class="row mb-4" *ngIf="!loading && cursos.length > 0">
            <div class="col-md-6 offset-md-3">
              <label class="form-control-label text-muted text-uppercase ls-1 font-weight-bold mb-2"
                style="font-size: 0.7rem;">
                <i class="fas fa-search mr-1" style="color: #38512F;"></i> Buscar Cursos
              </label>
              <input type="text" class="form-control" placeholder="Buscar por nombre o descripción..."
                [(ngModel)]="filtroNombre" (input)="filtrarCursos()" style="border-radius: 8px;">
            </div>
          </div>

          <!-- Estados de Carga y Vacío -->
          <div class="row" *ngIf="loading">
            <div class="col-12 text-center py-5">
              <i class="fas fa-spinner fa-spin fa-2x text-muted"></i>
              <p class="text-muted mt-2 mb-0">Cargando cursos...</p>
            </div>
          </div>

          <div class="row" *ngIf="!loading && cursos.length === 0">
            <div class="col-12 text-center py-5">
              <i class="fas fa-graduation-cap fa-2x text-muted"></i>
              <p class="text-muted mt-2 mb-0">No hay cursos disponibles en esta categoría</p>
            </div>
          </div>

          <div class="row" *ngIf="!loading && cursos.length > 0 && cursosFiltrados.length === 0">
            <div class="col-12 text-center py-5">
              <i class="fas fa-search fa-2x text-muted"></i>
              <p class="text-muted mt-2 mb-0">No se encontraron cursos que coincidan con tu búsqueda</p>
            </div>
          </div>

          <!-- Grid de Cursos -->
          <div class="row" *ngIf="!loading && cursosFiltrados.length > 0">
            <div *ngFor="let curso of cursosFiltrados" class="col-xl-4 col-lg-4 col-md-6 mb-4">
              <div class="card curso-card shadow-sm border-0"
                   (click)="abrirCurso(curso.id)"
                   role="button"
                   [attr.aria-label]="'Ver curso: ' + curso.nombre"
                   tabindex="0"
                   (keydown.enter)="abrirCurso(curso.id)">

                <!-- Header: imagen con overlay de color -->
                <div class="curso-card-img-wrap" *ngIf="curso.imagen">
                  <img [src]="curso.imagen"
                       [alt]="curso.nombre"
                       class="curso-card-img"
                       loading="lazy"
                       (error)="onImageError(curso)">
                  <div class="curso-card-color-overlay"></div>
                </div>
                <!-- Header: fallback ícono -->
                <div class="curso-card-header" *ngIf="!curso.imagen"
                  style="background: linear-gradient(135deg, #E67E22 0%, #E67E22CC 100%);">
                  <i [ngClass]="'fas ' + curso.icono + ' text-white'" style="font-size: 2.5rem;"></i>
                </div>

                <!-- Contenido -->
                <div class="curso-card-body">
                  <h5 class="curso-card-title">{{ curso.nombre }}</h5>
                  <p class="curso-card-desc">{{ curso.descripcion }}</p>

                  <div class="curso-card-footer">
                    <button class="btn btn-sm btn-ver-curso" (click)="$event.stopPropagation(); abrirCurso(curso.id)">
                      <i class="fas fa-play mr-1" style="font-size: 0.65rem;"></i>Ver Curso
                    </button>
                    <span class="curso-card-horas">
                      <i class="far fa-clock"></i>{{ curso.horas }}h
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div><!-- Fin card-body -->
      </div><!-- Fin card -->

    </div>
  </div>
</div>
