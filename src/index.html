<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Sistema Integral de Gestión - Biznaga Risk & Tech">
  <meta name="author" content="Biznaga R&T">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <title>Sistema Integral Biznaga</title>
  <link href="./assets/img/brand/favicon0.png" rel="icon" type="image/png">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet">
  <link href="./assets/vendor/nucleo/css/nucleo.css" rel="stylesheet">
  <link href="./assets/vendor/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        { pageLanguage: 'es', includedLanguages: 'es,en', autoDisplay: false },
        'google_translate_element'
      );
    }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

</head>
<body>
  <div id="google_translate_element" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;"></div>
  <app-root>
    <style>
      .app-boot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Open Sans', sans-serif;
        color: #38512f;
        background: #f8f9fe;
      }
      .app-boot-loader__spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(56, 81, 47, 0.15);
        border-top-color: #38512f;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div class="app-boot-loader">
      <div class="app-boot-loader__spinner" aria-hidden="true"></div>
      <p style="margin: 0; font-size: 0.95rem; opacity: 0.85;">Cargando sistema...</p>
    </div>
  </app-root>
</body>
</html>
